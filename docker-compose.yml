services:
  postgres:
    image: postgres:16-alpine
    container_name: clipmarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clipmarket
    ports:
      - "5435:5432"
    volumes:
      - clipmarket-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clipmarket"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  clipmarket-pgdata:
